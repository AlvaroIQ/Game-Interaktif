<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebak Hewannya!</title>
    <!-- Memuat Library Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Bubblegum Sans', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background: white;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 650px;
            width: 100%;
            text-align: center;
            border: 5px solid #e17055;
            position: relative;
        }

        /* Tombol Kembali ke Beranda */
        .home-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: #ff7675;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(255, 118, 117, 0.4);
            transition: transform 0.2s, background 0.2s;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .home-btn:hover {
            background-color: #d63031;
            transform: scale(1.05);
        }

        h1 {
            color: #d63031;
            font-size: 26px;
            margin-bottom: 5px;
            margin-top: 15px;
            text-shadow: 2px 2px 0px #ffeaa7;
        }

        p.instruction {
            color: #555;
            font-size: 16px;
            margin-bottom: 15px;
        }

        /* Overlay Tombol Play Awal */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }

        #start-overlay h2 {
            color: #d63031;
            font-size: 30px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #ffeaa7;
        }

        #play-btn {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 184, 148, 0.4);
            transition: transform 0.2s, background 0.2s;
            z-index: 101;
        }

        #play-btn:hover {
            background-color: #00cec9;
            transform: scale(1.05);
        }

        /* Area Putar Suara / Soal */
        .sound-box {
            background: #f1f2f6;
            border: 3px dashed #747d8c;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #sound-btn {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(9, 132, 227, 0.4);
            transition: transform 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 5;
        }

        #sound-btn:hover {
            background-color: #74b9ff;
            transform: scale(1.05);
        }

        /* Pilihan Gambar Hewan (Opsi Jawaban) */
        .options-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #ffeaa7;
            border: 4px solid #fdcb6e;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            min-height: 120px;
            z-index: 5;
        }

        .option-btn .animal-emoji {
            font-size: 55px;
            animation: popIn 0.3s ease-out;
        }

        .option-btn .animal-name {
            font-size: 16px;
            font-weight: bold;
            color: #2d3436;
            margin-top: 5px;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .option-btn:hover {
            background-color: #fdcb6e;
            transform: scale(1.05);
        }

        .option-btn.correct {
            background-color: #00b894 !important;
            border-color: #00cec9 !important;
            transform: scale(1.06);
        }

        .option-btn.wrong {
            background-color: #ff7675 !important;
            border-color: #d63031 !important;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* Status & Level Info */
        .game-info {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: #2d3436;
            margin-top: 15px;
            padding: 0 10px;
        }

        #feedback-text {
            font-size: 20px;
            font-weight: bold;
            height: 30px;
            margin-bottom: 10px;
        }

        #next-btn {
            background-color: #e17055;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(225, 112, 85, 0.4);
            display: none;
            transition: background 0.2s;
            z-index: 5;
        }

        #next-btn:hover {
            background-color: #fab1a0;
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="https://files.catbox.moe/ohhdm6.mp3" preload="auto" loop></audio>
    <audio id="win-music" src="https://files.catbox.moe/wsohm6.mp3" preload="auto"></audio>

    <div class="game-container">
        <!-- Tombol Kembali ke Beranda -->
        <a href="index.html" class="home-btn">🏠 Beranda</a>

        <div id="start-overlay">
            <h2>🦁 Tebak Hewannya! 🐶</h2>
            <button id="play-btn" onclick="startGame()">Mulai Main 🚀</button>
        </div>

        <h1>⭐ Siapa Aku? (Tebak Suara) ⭐</h1>
        <p class="instruction">Dengarkan suaranya!</p>

        <div class="game-info">
            <div>Soal ke: <span id="current-level">1</span> / 5</div>
            <div>Skor: <span id="score">0</span></div>
        </div>

        <div id="feedback-text"></div>

        <div class="sound-box">
            <button id="sound-btn" onclick="playAnimalSound()">🔊 Dengar Suara Hewan</button>
        </div>

        <div class="options-container" id="options-container"></div>

        <button id="next-btn" onclick="nextQuestion()">Lanjut Soal Berikutnya ➡️</button>
    </div>

    <script>
        const masterAnimals = [
            { name: 'Kucing', emoji: '🐱', soundUrl: 'https://files.catbox.moe/wq0cn2.mp3' },
            { name: 'Anjing', emoji: '🐶', soundUrl: 'https://files.catbox.moe/yz56se.mp3' },
            { name: 'Sapi', emoji: '🐮', soundUrl: 'https://files.catbox.moe/hz4xbg.mp3' },
            { name: 'Bebek', emoji: '🦆', soundUrl: 'https://files.catbox.moe/zr09ol.mp3' },
            { name: 'Ayam', emoji: '🐔', soundUrl: 'https://files.catbox.moe/i2v31v.mp3' },
            { name: 'Kambing', emoji: '🐐', soundUrl: 'https://files.catbox.moe/whg1fe.mp3' },
            { name: 'Singa', emoji: '🦁', soundUrl: 'https://files.catbox.moe/zyvh8t.mp3' }
        ];

        let activeLevels = [];
        let currentLevelIndex = 0;
        let score = 0;
        let canAnswer = true;
        let currentAudio = null;

        const startOverlay = document.getElementById('start-overlay');
        const optionsContainer = document.getElementById('options-container');
        const scoreDisplay = document.getElementById('score');
        const levelDisplay = document.getElementById('current-level');
        const feedbackText = document.getElementById('feedback-text');
        const nextBtn = document.getElementById('next-btn');
        const bgMusic = document.getElementById('bg-music');
        const winMusic = document.getElementById('win-music');

        bgMusic.volume = 0.2;
        winMusic.volume = 0.5;

        function startGame() {
            startOverlay.style.display = 'none';
            bgMusic.currentTime = 0;
            bgMusic.play().catch(() => {});
            initGame();
        }

        function initGame() {
            currentLevelIndex = 0;
            score = 0;
            scoreDisplay.textContent = score;
            winMusic.pause();
            winMusic.currentTime = 0;
            activeLevels = [...masterAnimals].sort(() => Math.random() - 0.5).slice(0, 5);
            loadLevel();
        }

        function playAnimalSound() {
            const currentObj = activeLevels[currentLevelIndex];
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            currentAudio = new Audio(currentObj.soundUrl);
            currentAudio.volume = 1.0;
            currentAudio.play().catch(err => console.log("Gagal memutar audio:", err));
        }

        function loadLevel() {
            canAnswer = true;
            feedbackText.textContent = '';
            nextBtn.style.display = 'none';
            levelDisplay.textContent = currentLevelIndex + 1;
            optionsContainer.innerHTML = '';

            const currentObj = activeLevels[currentLevelIndex];
            let choices = [currentObj];
            while (choices.length < 4) {
                let randomAnimal = masterAnimals[Math.floor(Math.random() * masterAnimals.length)];
                if (!choices.includes(randomAnimal)) {
                    choices.push(randomAnimal);
                }
            }
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(animal => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                btn.innerHTML = `
                    <span class="animal-emoji">${animal.emoji}</span>
                    <span class="animal-name">${animal.name}</span>
                `;
                btn.onclick = () => checkAnswer(animal.name, currentObj.name, btn);
                optionsContainer.appendChild(btn);
            });

            setTimeout(() => {
                playAnimalSound();
            }, 600);
        }

        function checkAnswer(selectedName, correctName, btnElement) {
            if (!canAnswer) return;
            canAnswer = false;

            if (currentAudio) {
                currentAudio.pause();
            }

            const allButtons = optionsContainer.querySelectorAll('.option-btn');

            if (selectedName === correctName) {
                btnElement.classList.add('correct');
                feedbackText.textContent = '🎉 Hebat! Jawabanmu Benar!';
                feedbackText.style.color = '#00b894';
                score += 20;
                scoreDisplay.textContent = score;
            } else {
                btnElement.classList.add('wrong');
                feedbackText.textContent = `❌ Ups, itu suara ${correctName}!`;
                feedbackText.style.color = '#d63031';
                allButtons.forEach(b => {
                    if (b.querySelector('.animal-name').textContent === correctName) {
                        b.classList.add('correct');
                    }
                });
            }

            if (currentLevelIndex < activeLevels.length - 1) {
                nextBtn.textContent = 'Lanjut Soal Berikutnya ➡️';
                nextBtn.style.display = 'inline-block';
            } else {
                endGame();
            }
        }

        function nextQuestion() {
            currentLevelIndex++;
            loadLevel();
        }

        function endGame() {
            feedbackText.textContent = '🌟 Hore! Kamu Berhasil Mengenal Semua Suara Hewan! 🌟';
            feedbackText.style.color = '#d63031';
            nextBtn.textContent = 'Main Lagi 🔄';
            nextBtn.onclick = () => {
                winMusic.pause();
                winMusic.currentTime = 0;
                bgMusic.currentTime = 0;
                bgMusic.play().catch(() => {});
                initGame();
                nextBtn.onclick = nextQuestion;
            };
            nextBtn.style.display = 'inline-block';

            bgMusic.pause();
            winMusic.currentTime = 0;
            winMusic.play().catch(() => {});

            confetti({
                particleCount: 200,
                spread: 100,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
